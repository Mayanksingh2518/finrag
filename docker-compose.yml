# FinRAG: the API + web UI and Postgres/pgvector.
#   docker compose up -d db && python -m app.retrieval.pg_store   # once: chunks + embeddings into Postgres
#   docker compose up --build                                     # app on http://127.0.0.1:8010
# Needs data/ prepared on the host (see CLAUDE.md "New machine setup") and .env (LLM keys, optional).
# Ollama stays on the host (Docker can't use the Mac GPU); the API reaches it at host.docker.internal.
# Postgres is on host port 5433, so a local Postgres on 5432 doesn't clash.
services:
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      VECTOR_BACKEND: pgvector
      DATABASE_URL: postgresql://finrag:finrag@db:5432/finrag
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DEVICE: cpu
    volumes:
      - ./data:/app/data           # XBRL facts, LLM response cache, traces (chunks/vectors come from db)
      - hfcache:/hf                # embedding + reranker models, downloaded on first start
    ports:
      - "127.0.0.1:8010:8010"

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: finrag
      POSTGRES_PASSWORD: finrag  # local development only; the port is bound to localhost
      POSTGRES_DB: finrag
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finrag -d finrag"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  hfcache:
